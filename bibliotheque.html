<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma bibliothèque — Cordélia W. Noble</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --carnet-bg: #26151F; --carnet-bg-alt: #341E33; --carnet-purple: #8C6AA8; --carnet-mauve: #C6AFDA;
    --carnet-rose: #E3AFC2; --carnet-cream: #F4E9D8; --carnet-amber: #E3A857; --carnet-text: #F4EBF2;
    --carnet-muted: #B79CC7; --carnet-line: rgba(230,200,220,.14); --carnet-glow: rgba(227,168,87,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 500px at 10% -10%, rgba(140,106,168,.22), transparent 60%),
      var(--carnet-bg);
    font-family:'Lora',serif;color:var(--carnet-text);
  }
  a{color:inherit;}
  .coll-wrap{max-width:1100px;margin:0 auto;padding:0 24px 110px;}
  .coll-back{display:inline-block;margin:26px 0 0;font-family:'Jost',sans-serif;font-size:.78rem;color:var(--carnet-muted);text-decoration:none;}
  .coll-back:hover{color:var(--carnet-rose);}

  .coll-hero{text-align:center;padding:44px 0 50px;}
  .coll-hero-icon{width:38px;height:38px;margin:0 auto 14px;opacity:.9;}
  .coll-hero-icon img{width:100%;height:100%;object-fit:contain;}
  .coll-hero h1{font-family:'Caveat',cursive;font-weight:600;font-size:2.6rem;color:var(--carnet-cream);margin:0 0 8px;}
  .coll-hero p{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--carnet-rose);font-size:1.1rem;}

  .coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px;}
  .coll-card{text-align:center;}
  .coll-cover-wrap{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;box-shadow:0 16px 30px -16px rgba(0,0,0,.55);border:1px solid var(--carnet-line);}
  .coll-cover{width:100%;height:100%;object-fit:cover;display:block;}
  .coll-cover-placeholder{
    display:flex;align-items:center;justify-content:center;background:var(--carnet-bg-alt);
    font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--carnet-muted);font-size:.75rem;padding:10px;text-align:center;
  }
  .coll-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.92rem;color:var(--carnet-text);margin-top:12px;line-height:1.4;}
  .coll-sub{font-family:'Jost',sans-serif;font-size:.7rem;color:var(--carnet-muted);margin-top:2px;}
  .coll-stars{color:var(--carnet-amber);letter-spacing:1px;font-size:.8rem;margin-top:5px;}
  .coll-empty{grid-column:1/-1;text-align:center;color:var(--carnet-muted);font-style:italic;font-family:'Lora',serif;padding:40px 0;}
  .loading-msg{text-align:center;padding:100px 20px;color:var(--carnet-muted);font-family:'Jost',sans-serif;}

  /* ---------- petite carte au survol (ordinateur) / au tap (tactile) ---------- */
  .coll-info-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:14px;gap:4px;
    background:linear-gradient(180deg, rgba(38,21,31,.82), rgba(38,21,31,.94));
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  @media(hover:hover){ .coll-card:hover .coll-info-overlay{opacity:1;pointer-events:auto;} }
  .coll-card.open .coll-info-overlay{opacity:1;pointer-events:auto;}
  .coll-info-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:.92rem;color:var(--carnet-cream);line-height:1.3;}
  .coll-info-sub{font-family:'Jost',sans-serif;font-size:.66rem;color:var(--carnet-mauve);}
  .coll-info-stars{color:var(--carnet-amber);letter-spacing:1px;font-size:.72rem;}
  .coll-info-ressenti{font-family:'Lora',serif;font-style:italic;font-size:.7rem;color:var(--carnet-rose);line-height:1.45;margin-top:2px;}

  @media(max-width:480px){
    .coll-grid{grid-template-columns:repeat(2,1fr);gap:18px;}
  }
</style>
</head>
<body>
<div class="coll-wrap">
  <a href="carnet.html" class="coll-back">↺ Retour au carnet</a>
  <div class="coll-hero">
    <div class="coll-hero-icon"><img src="assets/carnet/icon-library.svg" alt="" onerror="this.style.display='none'"></div>
    <h1>Ma bibliothèque</h1>
    <p>Les livres qui sont restés.</p>
  </div>
  <div class="coll-grid" id="collGrid"><p class="loading-msg">Chargement…</p></div>
</div>

<script src="carnet-collections.js"></script>
<script>
(async function init(){
  const grid = document.getElementById('collGrid');
  const books = await loadCSV('https://docs.google.com/spreadsheets/d/e/2PACX-1vTdNmyrBphzLHTTLQ-famSpzb4KIL_KFPvBd8B8NO6uCPux2sRQCFI_P_rgynnxDEkc1C-kbMiPJDD-/pub?gid=0&single=true&output=csv');
  if(!books.length){
    grid.innerHTML = '<p class="coll-empty">Aucun livre pour le moment.</p>';
    return;
  }
  grid.innerHTML = books.map(bookCardHtml).join('');
})();
</script>
</body>
</html>
