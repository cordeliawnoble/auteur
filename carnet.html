<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet — Cordélia W. Noble</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     CARNET — direction artistique "cozy witch"
     Variables propres au Carnet, aucun impact sur le site principal.
     ========================================================== */
  :root{
    --carnet-bg: #26151F;          /* aubergine très sombre, fond général */
    --carnet-bg-alt: #341E33;      /* prune, fond des cartes sombres */
    --carnet-bg-alt2: #3F253E;     /* prune un peu plus clair, hover/accent */
    --carnet-purple: #8C6AA8;      /* mauve profond, accent principal */
    --carnet-mauve: #C6AFDA;       /* mauve clair, texte secondaire sur fond sombre */
    --carnet-rose: #E3AFC2;        /* vieux rose, accent doux */
    --carnet-pink: #F0C9D8;        /* rose poudré clair */
    --carnet-cream: #F4E9D8;       /* crème chaud, "papier" */
    --carnet-parchment: #EFE2C8;   /* parchemin, fond des notes/fragments */
    --carnet-parchment-dark: #E4D2B0;
    --carnet-amber: #E3A857;       /* ambre doré, étoiles/accents lumineux */
    --carnet-text: #F4EBF2;        /* texte clair sur fond sombre */
    --carnet-text-dark: #3A2740;   /* texte sombre sur parchemin */
    --carnet-muted: #B79CC7;       /* texte discret sur fond sombre */
    --carnet-muted-dark: #7A6852;  /* texte discret sur parchemin */
    --carnet-line: rgba(230, 200, 220, .14);
    --carnet-line-parchment: rgba(90, 60, 40, .16);
    --carnet-glow: rgba(227, 168, 87, .25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(140,106,168,.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(227,175,194,.12), transparent 55%),
      var(--carnet-bg);
    font-family:'Lora',serif;color:var(--carnet-text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .carnet-wrap{max-width:960px;margin:0 auto;padding:0 24px 110px;}

  /* points lumineux discrets, dessinés en CSS (pas une illustration) */
  .carnet-stars{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle, rgba(244,235,242,.6) 1px, transparent 1.4px) 10% 8%/140px 140px,
      radial-gradient(circle, rgba(244,235,242,.4) 1px, transparent 1.4px) 60% 20%/180px 180px,
      radial-gradient(circle, rgba(227,168,87,.5) 1.2px, transparent 1.6px) 85% 5%/220px 220px,
      radial-gradient(circle, rgba(244,235,242,.35) 1px, transparent 1.4px) 30% 45%/160px 160px;
    animation: carnetTwinkle 6s ease-in-out infinite alternate;
  }
  @keyframes carnetTwinkle{ from{opacity:.5;} to{opacity:1;} }
  @media(prefers-reduced-motion: reduce){ .carnet-stars{animation:none;opacity:.75;} }

  .carnet-back{
    position:relative;z-index:1;display:inline-block;margin:26px 0 0;font-family:'Jost',sans-serif;
    font-size:.78rem;color:var(--carnet-muted);text-decoration:none;letter-spacing:.02em;
  }
  .carnet-back:hover{color:var(--carnet-rose);}

  /* ---------- Hero ---------- */
  .carnet-hero{position:relative;z-index:1;margin:20px 0 40px;border-radius:22px;overflow:hidden;}
  .carnet-hero-img{width:100%;display:block;border-radius:22px;}
  .carnet-hero-fallback{
    text-align:center;padding:56px 24px 60px;border-radius:22px;
    background:
      linear-gradient(180deg, rgba(38,21,31,.35), rgba(38,21,31,.75)),
      linear-gradient(160deg, #3F253E, #26151F 70%);
  }
  .carnet-moon{
    width:46px;height:46px;border-radius:50%;margin:0 auto 18px;
    background:var(--carnet-cream);
    box-shadow:-15px -3px 0 2px var(--carnet-bg-alt2) inset, 0 0 24px var(--carnet-glow);
  }
  .carnet-hero-fallback h1{
    font-family:'Caveat',cursive;font-weight:600;font-size:3.4rem;color:var(--carnet-cream);
    margin:0 0 6px;line-height:1;
  }
  .carnet-hero-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;color:var(--carnet-rose);margin:0;}
  .carnet-hero-text{
    font-family:'Lora',serif;color:var(--carnet-mauve);line-height:1.8;max-width:48ch;margin:0 auto 20px;
    font-size:.95rem;text-align:center;position:relative;z-index:1;
  }

  /* ---------- Sections génériques ---------- */
  .carnet-section{position:relative;z-index:1;margin-top:64px;}
  .carnet-section-title{text-align:center;margin-bottom:6px;}
  .carnet-section-title h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.9rem;color:var(--carnet-pink);margin:0;}
  .carnet-section-sub{text-align:center;font-family:'Lora',serif;font-style:italic;color:var(--carnet-muted);font-size:.88rem;margin:6px 0 32px;}

  /* ---------- En ce moment ---------- */
  .carnet-now-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .carnet-now-card{
    background:var(--carnet-bg-alt);border:1px solid var(--carnet-line);border-radius:14px;
    padding:18px 16px;transition:.25s;text-align:center;
  }
  .carnet-now-card:hover{background:var(--carnet-bg-alt2);border-color:var(--carnet-purple);}
  .carnet-now-icon{
    width:54px;height:54px;margin:0 auto 12px;opacity:.95;
    display:flex;align-items:center;justify-content:center;
  }
  .carnet-now-icon img{width:100%;height:100%;object-fit:contain;}
  .carnet-now-icon .icon-fallback{width:12px;height:12px;border-radius:50%;background:var(--carnet-amber);}
  .carnet-now-label{font-family:'Jost',sans-serif;font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--carnet-amber);margin-bottom:6px;}
  .carnet-now-main{font-family:'Lora',serif;font-size:.9rem;color:var(--carnet-text);line-height:1.35;}
  .carnet-now-sub{font-family:'Jost',sans-serif;font-size:.72rem;color:var(--carnet-muted);margin-top:3px;}
  .carnet-now-stars{color:var(--carnet-amber);letter-spacing:1px;font-size:.8rem;margin-top:5px;}
  .carnet-now-empty{grid-column:1/-1;text-align:center;color:var(--carnet-muted);font-style:italic;font-family:'Lora',serif;font-size:.9rem;padding:20px 0;}
  @media(max-width:700px){ .carnet-now-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:460px){ .carnet-now-grid{grid-template-columns:1fr;} }

  /* ---------- Fragments de moi (petites fiches façon parchemin) ---------- */
  .carnet-fragments-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
  .carnet-fragment-card{
    background:var(--carnet-parchment);color:var(--carnet-text-dark);border-radius:4px;
    padding:20px 20px 22px;box-shadow:0 14px 26px -16px rgba(0,0,0,.45);
    position:relative;
  }
  .carnet-fragment-card:nth-child(3n+1){ transform:rotate(-1.1deg); }
  .carnet-fragment-card:nth-child(3n+2){ transform:rotate(.8deg); }
  .carnet-fragment-card:nth-child(3n+3){ transform:rotate(-.5deg); }
  .carnet-fragment-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.05rem;color:var(--carnet-purple);margin-bottom:8px;}
  .carnet-fragment-body{font-family:'Lora',serif;font-size:.86rem;line-height:1.6;}
  .carnet-fragment-body p{margin:0 0 .7em;}

  /* ---------- Notes de marge (carrousel 3 par 3) ---------- */
  .carnet-notes-carousel{display:flex;align-items:center;gap:14px;}
  .carnet-notes-list{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0;}
  .carnet-note{
    display:flex;gap:18px;align-items:center;background:var(--carnet-bg-alt);border:1px solid var(--carnet-line);
    border-radius:12px;padding:14px 20px;cursor:pointer;transition:.2s;
  }
  .carnet-note:hover{background:var(--carnet-bg-alt2);border-color:var(--carnet-rose);}
  .carnet-note-date{
    flex-shrink:0;width:60px;font-family:'Jost',sans-serif;font-size:.64rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--carnet-amber);border-right:1px solid var(--carnet-line);padding-right:14px;
    line-height:1.4;
  }
  .carnet-note-body{flex:1;min-width:0;}
  .carnet-note-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.08rem;color:var(--carnet-pink);margin-bottom:3px;}
  .carnet-note-excerpt{font-family:'Lora',serif;font-size:.8rem;color:var(--carnet-mauve);line-height:1.5;}
  .carnet-note-img-wrap{flex-shrink:0;width:84px;height:64px;border-radius:8px;overflow:hidden;}
  .carnet-note-img{width:100%;height:100%;object-fit:cover;display:block;}
  .carnet-notes-arrow{
    flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--carnet-bg-alt);
    border:1px solid var(--carnet-line);color:var(--carnet-amber);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:1rem;transition:.2s;
  }
  .carnet-notes-arrow:hover{background:var(--carnet-bg-alt2);border-color:var(--carnet-rose);}
  .carnet-notes-arrow[disabled]{opacity:.3;cursor:default;pointer-events:none;}
  .carnet-notes-dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
  .carnet-notes-dot{width:6px;height:6px;border-radius:50%;background:var(--carnet-line);}
  .carnet-notes-dot.active{background:var(--carnet-amber);}
  @media(max-width:600px){
    .carnet-note{flex-direction:column;align-items:stretch;gap:10px;}
    .carnet-note-date{border-right:none;border-bottom:1px solid var(--carnet-line);padding:0 0 8px;width:auto;}
    .carnet-note-img-wrap{width:100%;height:120px;}
    .carnet-notes-carousel{gap:8px;}
  }

  /* ---------- Mes petits terriers (portes) ---------- */
  .carnet-doors-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .carnet-door{
    position:relative;display:block;min-height:230px;border-radius:16px;overflow:hidden;
    text-decoration:none;padding:26px 24px;display:flex;flex-direction:column;justify-content:flex-end;
    transition:.25s;
  }
  .carnet-door-library{
    background:linear-gradient(160deg, #3F253E, #26151F);
  }
  .carnet-door-gaming{
    background:linear-gradient(160deg, #2E2050, #26151F);
  }
  .carnet-door:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(0,0,0,.6);}
  .carnet-door-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.5rem;color:var(--carnet-cream);margin-bottom:6px;}
  .carnet-door-sub{font-family:'Lora',serif;font-style:italic;font-size:.85rem;color:var(--carnet-mauve);margin-bottom:14px;}
  .carnet-door-cta{font-family:'Jost',sans-serif;font-size:.8rem;color:var(--carnet-amber);}
  @media(max-width:640px){ .carnet-doors-grid{grid-template-columns:1fr;} }

  /* ---------- Mes copines ---------- */
  .carnet-friends-block{
    background:var(--carnet-bg-alt);border:1px solid var(--carnet-line);border-radius:14px;padding:26px 24px;
  }
  .carnet-friends-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px;}
  .carnet-friend{
    display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;text-decoration:none;
    text-align:center;transition:.2s;
  }
  .carnet-friend:hover{transform:translateY(-2px);}
  .carnet-friend-avatar{
    width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--carnet-line);
  }
  .carnet-friend-avatar-fallback{
    display:flex;align-items:center;justify-content:center;background:var(--carnet-bg-alt2);
    color:var(--carnet-rose);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;
  }
  .carnet-friend-name{font-family:'Lora',serif;font-size:.8rem;color:var(--carnet-text);line-height:1.3;}
  .carnet-friend-tag{font-family:'Jost',sans-serif;font-size:.66rem;color:var(--carnet-muted);}

  .loading-msg{text-align:center;padding:100px 20px;color:var(--carnet-muted);font-family:'Jost',sans-serif;position:relative;z-index:1;}
</style>
</head>
<body>
<div class="carnet-stars" aria-hidden="true"></div>
<div class="carnet-wrap" id="app"><p class="loading-msg">Chargement…</p></div>

<script>
/* ---------- connexion Supabase (identique à celle du site principal) ---------- */
const SUPABASE_URL = "https://naiiewmyyksoxwvzcwuo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5haWlld215eWtzb3h3dnpjd3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODc2MDcsImV4cCI6MjA5OTE2MzYwN30.uvJ2GXz1L4FCCbLBxy16oq4QbXUYkp-4atTpdKMaUhs";
function supabaseHeaders(extra){
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }, extra || {});
}
async function sbGet(key){
  const url = SUPABASE_URL + '/rest/v1/kv_store?key=eq.' + encodeURIComponent(key) + '&select=value';
  const res = await fetch(url, { headers: supabaseHeaders() });
  if(!res.ok) throw new Error('Supabase get a échoué (' + res.status + ')');
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}

/* ---------- utilitaires repris du site principal ---------- */
function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatRichText(str){
  let s = escapeHtml(str||'');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/_(.+?)_/g, '<em>$1</em>');
  s = s.replace(/\+\+(.+?)\+\+/g, '<u>$1</u>');
  s = s.replace(/~~(.+?)~~/g, '<s>$1</s>');
  return s;
}
const RICH_FIELD_FONTS = {
  'lora': "'Lora', serif", 'georgia': "Georgia, 'Times New Roman', serif",
  'playfair': "'Playfair Display', serif", 'jost': "'Jost', sans-serif", 'caveat': "'Caveat', cursive"
};
function extractFieldStyle(text){
  const m = /^<!--style:([^>]*)-->/.exec(text||'');
  if(!m) return { font:'', size:'', body:text||'' };
  const params = {};
  m[1].split(';').forEach(p=>{ const parts=p.split('='); const k=parts[0]; const v=parts[1]; if(k) params[k]=v||''; });
  return { font: params.font||'', size: params.size||'', body: (text||'').slice(m[0].length) };
}
function fieldStyleCss(font, size){
  let css = '';
  if(font && RICH_FIELD_FONTS[font]) css += 'font-family:'+RICH_FIELD_FONTS[font]+';';
  if(size) css += 'font-size:'+size+'px;';
  return css;
}
function richParagraphs(text){
  const parsed = extractFieldStyle(text);
  const html = (parsed.body||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>'<p>'+formatRichText(p).replace(/\n/g,'<br>')+'</p>').join('');
  const css = fieldStyleCss(parsed.font, parsed.size);
  return css ? '<div style="'+css+'">'+html+'</div>' : html;
}
function formatDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return escapeHtml(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'}).toUpperCase();
}
function starsHtml(rating){
  rating = Math.round(rating||0);
  return '★★★★★☆☆☆☆☆'.slice(5-rating, 10-rating);
}

/* ---------- catégories d'actualités ---------- */
let POST_CATEGORIES = {};
function catMeta(name){ return POST_CATEGORIES[name] || { icon:'', description:'', active:true }; }
function postsInCategory(cat){
  return POSTS.filter(function(p){ return p.category===cat; }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}

/* icônes "En ce moment" : emplacement prévu pour vos SVG (assets/carnet/icon-*.svg).
   Repli discret (petit point doré) tant que le fichier n'existe pas. */
function nowIconHtml(iconUrl, label){
  if(iconUrl){
    return '<div class="carnet-now-icon"><img src="'+escapeHtml(iconUrl)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'icon-fallback\'}))"></div>';
  }
  return '<div class="carnet-now-icon"><span class="icon-fallback"></span></div>';
}

/* ---------- rendu de la page ---------- */
const app = document.getElementById('app');
let SETTINGS = {};
let POSTS = [];

function renderCarnet(){
  const reading = SETTINGS.moreAboutReading || {};
  const playing = SETTINGS.moreAboutPlaying || {};
  const watching = SETTINGS.moreAboutWatching || {};
  const listening = SETTINGS.moreAboutListening || {};
  const obsession = SETTINGS.moreAboutObsession || {};
  const craving = SETTINGS.moreAboutCraving || {};

  const nowEntries = [
    { label:'Je lis', icon: reading.icon, main: reading.title, sub: reading.author, stars: reading.rating },
    { label:'Je joue', icon: playing.icon, main: playing.title, sub: playing.platform },
    { label:'Je regarde', icon: watching.icon, main: watching.title, sub: watching.detail },
    { label:"J'écoute", icon: listening.icon, main: listening.song, sub: listening.artist },
    { label:'Mon obsession du moment', icon: obsession.icon, main: obsession.title, sub: obsession.detail },
    { label:"J'ai envie de", icon: craving.icon, main: craving.title, sub: craving.detail }
  ].filter(function(e){ return e.main; });

  const friends = SETTINGS.moreAboutFriends || [];

  const fragments = postsInCategory('fragments-de-moi');
  const allNotes = postsInCategory('notes-de-marge');
  window.CARNET_ALL_NOTES = allNotes; // pour le carrousel

  let html = '';
  html += '<a href="https://cordeliawnoble.fr/" class="carnet-back">↺ Retour au site d\'autrice</a>';

  html += '<header class="carnet-hero">';
  if(SETTINGS.moreAboutHeroImage){
    html += '<img src="'+escapeHtml(SETTINGS.moreAboutHeroImage)+'" alt="Carnet — quelques morceaux de moi, entre deux histoires." class="carnet-hero-img">';
  }else{
    html += '<div class="carnet-hero-fallback">';
    html += '<div class="carnet-moon" aria-hidden="true"></div>';
    html += '<h1 style="font-family:\'Caveat\',cursive;font-weight:600;font-size:3.4rem;color:var(--carnet-cream);margin:0 0 6px;line-height:1;">Carnet</h1>';
    html += '<p class="carnet-hero-sub">Quelques morceaux de moi, entre deux histoires.</p>';
    html += '</div>';
  }
  html += '</header>';
  html += '<p class="carnet-hero-text">' + (SETTINGS.carnetIntro ? richParagraphs(SETTINGS.carnetIntro) : "Ici se trouvent mes lectures du moment, mes jeux, mes découvertes, mes petites obsessions, et quelques fragments un peu plus personnels.") + '</p>';

  html += '<section class="carnet-section">';
  html += '<div class="carnet-section-title"><h2>En ce moment</h2></div>';
  html += '<div class="carnet-now-grid">';
  if(nowEntries.length){
    nowEntries.forEach(function(e){
      html += '<div class="carnet-now-card">';
      html += '<div class="carnet-now-label">'+escapeHtml(e.label)+'</div>';
      html += nowIconHtml(e.icon, e.label);
      html += '<div class="carnet-now-main">'+escapeHtml(e.main)+'</div>';
      if(e.sub) html += '<div class="carnet-now-sub">'+escapeHtml(e.sub)+'</div>';
      if(e.stars) html += '<div class="carnet-now-stars" role="img" aria-label="Note : '+e.stars+' sur 5">'+starsHtml(e.stars)+'</div>';
      html += '</div>';
    });
  }else{
    html += '<div class="carnet-now-empty">Rien à afficher pour le moment.</div>';
  }
  html += '</div></section>';

  if(fragments.length){
    html += '<section class="carnet-section">';
    html += '<div class="carnet-section-title"><h2>Fragments de moi</h2></div>';
    html += '<p class="carnet-section-sub">Quelques informations d\'une importance très discutable.</p>';
    html += '<div class="carnet-fragments-grid">';
    fragments.forEach(function(p){
      html += '<div class="carnet-fragment-card">';
      if(p.title) html += '<div class="carnet-fragment-title">'+escapeHtml(p.title)+'</div>';
      html += '<div class="carnet-fragment-body">'+richParagraphs(p.body)+'</div>';
      html += '</div>';
    });
    html += '</div></section>';
  }

  if(allNotes.length){
    html += '<section class="carnet-section">';
    html += '<div class="carnet-section-title"><h2>Notes de marge</h2></div>';
    html += '<p class="carnet-section-sub">Des pensées, des découvertes et des choses que j\'avais simplement envie de déposer ici.</p>';
    html += '<div id="carnetNotesCarousel"></div>';
    html += '</section>';
  }

  const libraryImg = SETTINGS.carnetLibraryImage
    ? "background-image:linear-gradient(180deg, rgba(38,21,31,.15), rgba(38,21,31,.9)), url('"+SETTINGS.carnetLibraryImage.replace(/'/g,"\\'")+"');background-size:cover;background-position:center;"
    : '';
  const gamingImg = SETTINGS.carnetLudothequeImage
    ? "background-image:linear-gradient(180deg, rgba(38,21,31,.15), rgba(38,21,31,.9)), url('"+SETTINGS.carnetLudothequeImage.replace(/'/g,"\\'")+"');background-size:cover;background-position:center;"
    : '';

  html += '<section class="carnet-section">';
  html += '<div class="carnet-section-title"><h2>Mes petits terriers</h2></div>';
  html += '<div class="carnet-doors-grid">';
  html += '<a href="bibliotheque.html" class="carnet-door carnet-door-library" style="'+libraryImg+'">';
  html += '<div class="carnet-door-title">Ma bibliothèque</div>';
  html += '<div class="carnet-door-sub">Les livres qui sont restés.</div>';
  html += '<div class="carnet-door-cta">Entrer dans ma bibliothèque →</div></a>';
  html += '<a href="ludotheque.html" class="carnet-door carnet-door-gaming" style="'+gamingImg+'">';
  html += '<div class="carnet-door-title">Ma ludothèque</div>';
  html += '<div class="carnet-door-sub">Les mondes dans lesquels j\'ai passé beaucoup trop de temps.</div>';
  html += '<div class="carnet-door-cta">Explorer ma ludothèque →</div></a>';
  html += '</div></section>';

  if(friends.length){
    html += '<section class="carnet-section">';
    html += '<div class="carnet-section-title"><h2>Mes copines</h2></div>';
    html += '<div class="carnet-friends-block">';
    html += '<div class="carnet-friends-grid">';
    friends.forEach(function(f){
      html += '<a href="'+escapeHtml(f.url||'#')+'" target="_blank" rel="noopener" class="carnet-friend">';
      if(f.avatar){
        html += '<img src="'+escapeHtml(f.avatar)+'" alt="" class="carnet-friend-avatar">';
      }else{
        html += '<span class="carnet-friend-avatar carnet-friend-avatar-fallback">'+escapeHtml((f.name||'?').charAt(0))+'</span>';
      }
      html += '<span class="carnet-friend-name">'+escapeHtml(f.name)+'</span>';
      if(f.tag) html += '<span class="carnet-friend-tag">'+escapeHtml(f.tag)+'</span>';
      html += '</a>';
    });
    html += '</div></div></section>';
  }

  app.innerHTML = html;
  if(window.CARNET_ALL_NOTES && window.CARNET_ALL_NOTES.length) drawNotesCarousel(0);
}

let carnetNotesPage = 0;
function drawNotesCarousel(page){
  const el = document.getElementById('carnetNotesCarousel');
  if(!el) return;
  const allNotes = window.CARNET_ALL_NOTES || [];
  const perPage = 3;
  const pageCount = Math.ceil(allNotes.length / perPage);
  carnetNotesPage = Math.max(0, Math.min(page, pageCount-1));
  const pageNotes = allNotes.slice(carnetNotesPage*perPage, carnetNotesPage*perPage+perPage);

  let html = '<div class="carnet-notes-carousel">';
  html += '<span class="carnet-notes-arrow" onclick="drawNotesCarousel(carnetNotesPage-1)" '+(carnetNotesPage<=0?'disabled':'')+' aria-label="Notes précédentes">←</span>';
  html += '<div class="carnet-notes-list">';
  pageNotes.forEach(function(p){
    const excerpt = richParagraphs(p.body).replace(/<[^>]+>/g,' ').trim().slice(0,90);
    const img = (p.images && p.images[0]) ? p.images[0] : '';
    html += '<div class="carnet-note" onclick="window.location.href=\'index.html#actualites/'+p.id+'\'">';
    html += '<div class="carnet-note-date">'+(p.date ? formatDateShort(p.date) : '')+'</div>';
    html += '<div class="carnet-note-body">';
    html += '<div class="carnet-note-title">'+escapeHtml(p.title)+'</div>';
    html += '<div class="carnet-note-excerpt">'+excerpt+'…</div>';
    html += '</div>';
    if(img) html += '<div class="carnet-note-img-wrap"><img src="'+escapeHtml(img)+'" alt="" class="carnet-note-img" loading="lazy"></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<span class="carnet-notes-arrow" onclick="drawNotesCarousel(carnetNotesPage+1)" '+(carnetNotesPage>=pageCount-1?'disabled':'')+' aria-label="Notes suivantes">→</span>';
  html += '</div>';

  if(pageCount > 1){
    html += '<div class="carnet-notes-dots">';
    for(let i=0;i<pageCount;i++){
      html += '<span class="carnet-notes-dot'+(i===carnetNotesPage?' active':'')+'"></span>';
    }
    html += '</div>';
  }

  el.innerHTML = html;
}

/* ---------- chargement des données puis affichage ---------- */
(async function init(){
  try{
    const results = await Promise.all([
      sbGet('site:settings'),
      sbGet('site:posts'),
      sbGet('site:postCategoriesMeta')
    ]);
    SETTINGS = results[0] ? JSON.parse(results[0]) : {};
    POSTS = results[1] ? JSON.parse(results[1]) : [];
    POST_CATEGORIES = results[2] ? JSON.parse(results[2]) : {};
    renderCarnet();
  }catch(err){
    app.innerHTML = '<p class="loading-msg">Impossible de charger le carnet pour le moment.<br>Réessayez dans un instant.</p>';
    console.error(err);
  }
})();
</script>
