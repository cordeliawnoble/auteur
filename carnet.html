<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet — Cordélia W. Noble</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3E4; --card:#fff; --ink:#2A2118; --muted:#8A7A64; --gold:#B8863E; --gold-soft:rgba(217,179,108,.18); --line:rgba(217,179,108,.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);font-family:'Jost',sans-serif;color:var(--ink);}
  a{color:inherit;}
  .carnet-wrap{max-width:900px;margin:0 auto;padding:0 24px 100px;}

  .carnet-back{
    display:inline-block;margin:26px 0 0;font-family:'Jost',sans-serif;font-size:.78rem;color:var(--muted);
    text-decoration:none;
  }
  .carnet-back:hover{color:var(--gold);}

  .carnet-hero{text-align:center;padding:50px 0 40px;}
  .carnet-hero h1{font-family:'Playfair Display',serif;font-size:2.6rem;color:var(--ink);margin:0 0 10px;}
  .carnet-hero-sub{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--gold);margin:0 0 22px;}
  .carnet-hero-text{font-family:'Lora',serif;font-style:italic;color:var(--muted);line-height:1.8;max-width:52ch;margin:0 auto;}

  .carnet-section{margin-top:70px;}
  .carnet-section-title{text-align:center;margin-bottom:8px;}
  .carnet-section-title h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--ink);margin:0;}
  .carnet-section-sub{text-align:center;font-family:'Lora',serif;font-style:italic;color:var(--muted);font-size:.9rem;margin:6px 0 30px;}

  /* En ce moment */
  .carnet-now-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .carnet-now-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 10px 22px -18px rgba(36,26,10,.25);}
  .carnet-now-label{font-family:'Jost',sans-serif;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .carnet-now-main{font-family:'Lora',serif;font-size:.9rem;color:var(--ink);line-height:1.35;}
  .carnet-now-sub{font-family:'Jost',sans-serif;font-size:.72rem;color:var(--muted);margin-top:2px;}
  .carnet-now-stars{color:var(--gold);letter-spacing:1px;font-size:.8rem;margin-top:4px;}
  .carnet-now-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-style:italic;font-family:'Lora',serif;font-size:.9rem;}
  @media(max-width:700px){ .carnet-now-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:460px){ .carnet-now-grid{grid-template-columns:1fr;} }

  /* Fragments de moi */
  .carnet-fragments-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .carnet-fragment-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 10px 22px -18px rgba(36,26,10,.2);
  }
  .carnet-fragment-title{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--gold);margin-bottom:8px;}
  .carnet-fragment-body{font-family:'Lora',serif;font-size:.88rem;line-height:1.6;color:var(--ink);}
  .carnet-fragment-body p{margin:0 0 .7em;}

  /* Notes de marge */
  .carnet-notes-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .carnet-note{padding:20px 22px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;}
  .carnet-note:last-child{border-bottom:none;}
  .carnet-note:hover{background:var(--gold-soft);}
  .carnet-note-date{font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .carnet-note-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--ink);margin-bottom:4px;}
  .carnet-note-excerpt{font-family:'Lora',serif;font-size:.85rem;color:var(--muted);line-height:1.6;}
  .carnet-more-link{display:block;text-align:center;margin-top:22px;font-family:'Jost',sans-serif;font-size:.82rem;color:var(--gold);text-decoration:none;}
  .carnet-more-link:hover{text-decoration:underline;}

  /* Portes Bibliothèque / Ludothèque */
  .carnet-doors-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .carnet-door{
    display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px;
    text-decoration:none;text-align:center;transition:.2s;box-shadow:0 10px 22px -18px rgba(36,26,10,.2);
  }
  .carnet-door:hover{transform:translateY(-3px);box-shadow:0 18px 32px -20px rgba(36,26,10,.3);}
  .carnet-door-icon{font-size:1.8rem;margin-bottom:10px;}
  .carnet-door-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--ink);margin-bottom:8px;}
  .carnet-door-sub{font-family:'Lora',serif;font-style:italic;font-size:.85rem;color:var(--muted);margin-bottom:14px;}
  .carnet-door-cta{font-family:'Jost',sans-serif;font-size:.8rem;color:var(--gold);}
  @media(max-width:640px){ .carnet-doors-grid{grid-template-columns:1fr;} }

  .loading-msg{text-align:center;padding:100px 20px;color:var(--muted);font-family:'Jost',sans-serif;}
</style>
</head>
<body>
<div class="carnet-wrap" id="app"><p class="loading-msg">Chargement…</p></div>

<script>
/* ---------- connexion Supabase (identique à celle du site principal) ---------- */
const SUPABASE_URL = "https://naiiewmyyksoxwvzcwuo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5haWlld215eWtzb3h3dnpjd3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODc2MDcsImV4cCI6MjA5OTE2MzYwN30.uvJ2GXz1L4FCCbLBxy16oq4QbXUYkp-4atTpdKMaUhs";
function supabaseHeaders(extra){
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }, extra || {});
}
async function sbGet(key){
  const url = SUPABASE_URL + '/rest/v1/kv_store?key=eq.' + encodeURIComponent(key) + '&select=value';
  const res = await fetch(url, { headers: supabaseHeaders() });
  if(!res.ok) throw new Error('Supabase get a échoué (' + res.status + ')');
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}

/* ---------- utilitaires repris du site principal ---------- */
function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatRichText(str){
  let s = escapeHtml(str||'');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/_(.+?)_/g, '<em>$1</em>');
  s = s.replace(/\+\+(.+?)\+\+/g, '<u>$1</u>');
  s = s.replace(/~~(.+?)~~/g, '<s>$1</s>');
  return s;
}
const RICH_FIELD_FONTS = {
  'lora': "'Lora', serif", 'georgia': "Georgia, 'Times New Roman', serif",
  'playfair': "'Playfair Display', serif", 'jost': "'Jost', sans-serif", 'caveat': "'Caveat', cursive"
};
function extractFieldStyle(text){
  const m = /^<!--style:([^>]*)-->/.exec(text||'');
  if(!m) return { font:'', size:'', body:text||'' };
  const params = {};
  m[1].split(';').forEach(p=>{ const parts=p.split('='); const k=parts[0]; const v=parts[1]; if(k) params[k]=v||''; });
  return { font: params.font||'', size: params.size||'', body: (text||'').slice(m[0].length) };
}
function fieldStyleCss(font, size){
  let css = '';
  if(font && RICH_FIELD_FONTS[font]) css += 'font-family:'+RICH_FIELD_FONTS[font]+';';
  if(size) css += 'font-size:'+size+'px;';
  return css;
}
function richParagraphs(text){
  const parsed = extractFieldStyle(text);
  const html = (parsed.body||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>'<p>'+formatRichText(p).replace(/\n/g,'<br>')+'</p>').join('');
  const css = fieldStyleCss(parsed.font, parsed.size);
  return css ? '<div style="'+css+'">'+html+'</div>' : html;
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return escapeHtml(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}
function starsHtml(rating){
  rating = Math.round(rating||0);
  return '★★★★★☆☆☆☆☆'.slice(5-rating, 10-rating);
}

/* ---------- catégories d'actualités ---------- */
let POST_CATEGORIES = {};
function catMeta(name){ return POST_CATEGORIES[name] || { icon:'', description:'', active:true }; }
function postsInCategory(cat){
  return POSTS.filter(function(p){ return p.category===cat; }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}

/* ---------- rendu de la page ---------- */
const app = document.getElementById('app');
let SETTINGS = {};
let POSTS = [];

function renderCarnet(){
  const reading = SETTINGS.moreAboutReading || {};
  const playing = SETTINGS.moreAboutPlaying || {};
  const watching = SETTINGS.moreAboutWatching || {};
  const listening = SETTINGS.moreAboutListening || {};
  const obsession = SETTINGS.moreAboutObsession || {};
  const craving = SETTINGS.moreAboutCraving || {};

  const nowEntries = [
    { label:'Je lis', main: reading.title, sub: reading.author, stars: reading.rating },
    { label:'Je joue', main: playing.title, sub: playing.platform },
    { label:'Je regarde', main: watching.title, sub: watching.detail },
    { label:"J'écoute", main: listening.song, sub: listening.artist },
    { label:'Mon obsession du moment', main: obsession.title, sub: obsession.detail },
    { label:"J'ai envie de", main: craving.title, sub: craving.detail }
  ].filter(function(e){ return e.main; });

  const fragments = postsInCategory('fragments-de-moi');
  const allNotes = postsInCategory('notes-de-marge');
  const notes = allNotes.slice(0,3);
  const firstNotePost = allNotes[0];

  let html = '';
  html += '<a href="https://cordeliawnoble.fr/" class="carnet-back">↺ Retour au site d\'autrice</a>';

  html += '<header class="carnet-hero">';
  html += '<h1>Carnet</h1>';
  html += '<p class="carnet-hero-sub">Quelques morceaux de moi, entre deux histoires.</p>';
  html += '<p class="carnet-hero-text">' + (SETTINGS.carnetIntro ? richParagraphs(SETTINGS.carnetIntro) : "Ici se trouvent mes lectures du moment, mes jeux, mes découvertes, mes petites obsessions, et quelques fragments un peu plus personnels.") + '</p>';
  html += '</header>';

  html += '<section class="carnet-section">';
  html += '<div class="carnet-section-title"><h2>En ce moment</h2></div>';
  html += '<div class="carnet-now-grid">';
  if(nowEntries.length){
    nowEntries.forEach(function(e){
      html += '<div class="carnet-now-card">';
      html += '<div class="carnet-now-label">'+escapeHtml(e.label)+'</div>';
      html += '<div class="carnet-now-main">'+escapeHtml(e.main)+'</div>';
      if(e.sub) html += '<div class="carnet-now-sub">'+escapeHtml(e.sub)+'</div>';
      if(e.stars) html += '<div class="carnet-now-stars" role="img" aria-label="Note : '+e.stars+' sur 5">'+starsHtml(e.stars)+'</div>';
      html += '</div>';
    });
  }else{
    html += '<div class="carnet-now-empty">Rien à afficher pour le moment.</div>';
  }
  html += '</div></section>';

  if(fragments.length){
    html += '<section class="carnet-section">';
    html += '<div class="carnet-section-title"><h2>Fragments de moi</h2></div>';
    html += '<p class="carnet-section-sub">Quelques informations d\'une importance très discutable.</p>';
    html += '<div class="carnet-fragments-grid">';
    fragments.forEach(function(p){
      html += '<div class="carnet-fragment-card">';
      if(p.title) html += '<div class="carnet-fragment-title">'+escapeHtml(p.title)+'</div>';
      html += '<div class="carnet-fragment-body">'+richParagraphs(p.body)+'</div>';
      html += '</div>';
    });
    html += '</div></section>';
  }

  if(notes.length){
    html += '<section class="carnet-section">';
    html += '<div class="carnet-section-title"><h2>Notes de marge</h2></div>';
    html += '<p class="carnet-section-sub">Des pensées, des découvertes et des choses que j\'avais simplement envie de déposer ici.</p>';
    html += '<div class="carnet-notes-list">';
    notes.forEach(function(p){
      const excerpt = richParagraphs(p.body).replace(/<[^>]+>/g,' ').trim().slice(0,140);
      html += '<div class="carnet-note" onclick="window.location.href=\'index.html#actualites/'+p.id+'\'">';
      if(p.date) html += '<div class="carnet-note-date">'+formatDate(p.date)+'</div>';
      html += '<div class="carnet-note-title">'+escapeHtml(p.title)+'</div>';
      html += '<div class="carnet-note-excerpt">'+excerpt+'…</div>';
      html += '</div>';
    });
    html += '</div>';
    if(firstNotePost) html += '<a href="index.html#actualites/'+firstNotePost.id+'" class="carnet-more-link">Toutes les notes →</a>';
    html += '</section>';
  }

  html += '<section class="carnet-section">';
  html += '<div class="carnet-section-title"><h2>Mes petits terriers</h2></div>';
  html += '<div class="carnet-doors-grid">';
  html += '<a href="bibliotheque.html" class="carnet-door">';
  html += '<div class="carnet-door-icon">📚</div><div class="carnet-door-title">Bibliothèque</div>';
  html += '<div class="carnet-door-sub">Les livres qui sont restés.</div>';
  html += '<div class="carnet-door-cta">Entrer dans ma bibliothèque →</div></a>';
  html += '<a href="ludotheque.html" class="carnet-door">';
  html += '<div class="carnet-door-icon">🎮</div><div class="carnet-door-title">Ludothèque</div>';
  html += '<div class="carnet-door-sub">Les mondes dans lesquels j\'ai passé beaucoup trop de temps.</div>';
  html += '<div class="carnet-door-cta">Explorer ma ludothèque →</div></a>';
  html += '</div></section>';

  app.innerHTML = html;

  if(SETTINGS.moreAboutBgImage){
    document.body.style.backgroundImage = "url('" + SETTINGS.moreAboutBgImage.replace(/'/g,"\\'") + "')";
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundAttachment = 'fixed';
  }
}

/* ---------- chargement des données puis affichage ---------- */
(async function init(){
  try{
    const results = await Promise.all([
      sbGet('site:settings'),
      sbGet('site:posts'),
      sbGet('site:postCategoriesMeta')
    ]);
    SETTINGS = results[0] ? JSON.parse(results[0]) : {};
    POSTS = results[1] ? JSON.parse(results[1]) : [];
    POST_CATEGORIES = results[2] ? JSON.parse(results[2]) : {};
    renderCarnet();
  }catch(err){
    app.innerHTML = '<p class="loading-msg">Impossible de charger le carnet pour le moment.<br>Réessayez dans un instant.</p>';
    console.error(err);
  }
})();
</script>
</body>
</html>
